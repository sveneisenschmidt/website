<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Encode+Sans:wght@300;400;900&display=swap">
  <style>
    body { margin: 0; }
    a { color: #222; }
    a:hover { color: #00e; }
  </style>
</helmet>

<div style="width: 800px; box-sizing: border-box; background: #fff; color: #222; font-family: 'Encode Sans', Arial, Helvetica, sans-serif; font-weight: 300; font-size: 18px; line-height: 1.6; padding: 16px;">

  <div style="text-align: center; font-size: 24px; font-weight: 900; text-transform: uppercase; line-height: 1.05;">&larr; Back</div>
  <div style="text-align: center; font-size: 16px; padding: 8px 0 16px; word-spacing: 10px;">Photos &middot; Writing &middot; Archive &middot; About</div>
  <div style="border-top: 1px solid #222;"></div>

  <div style="font-size: 32px; font-weight: 900; text-transform: uppercase; line-height: 1.05; margin: 16px 0 8px;">England, Day 3</div>
  <div style="font-size: 16px; font-weight: 400;">April 25, 2026 &middot; Day 3 of 5</div>

  <p style="margin: 0; padding-top: 8px; font-size: 16px;">Rain all morning, then the light broke over the estuary for about twenty minutes.</p>

  <div style="width: 100%; height: 100px; background: #f2f2f2; margin-top: 16px; display: flex; align-items: center; padding-left: 16px; font-size: 12.8px; font-weight: 400; text-transform: uppercase; letter-spacing: 0.08em;">Route</div>

  <sc-for list="{{shots}}" as="s" hint-placeholder-count="3">
    <div style="margin-top: 32px;">
      <div style="width: 100%; aspect-ratio: {{s.ar}}; background: #d8d8d8; border-radius: 4px;"></div>
      <div style="font-size: 16px; font-weight: 400; padding-top: 8px;">{{s.cap}}</div>
      <div style="font-size: 12.8px; font-weight: 400; text-transform: uppercase; letter-spacing: 0.08em; padding-top: 4px;">{{s.exif}}</div>
    </div>
  </sc-for>

  <div style="font-size: 16px; font-weight: 400; padding-top: 32px;">16 more from this day</div>

  <div style="display: flex; justify-content: space-between; margin-top: 32px; padding-top: 16px; border-top: 1px solid #222; font-size: 16px; font-weight: 400;"><div>&larr; England, Day 2</div><div>England, Day 4 &rarr;</div></div>

</div>

</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {
      shots: [
        { ar: '3 / 2', cap: 'The estuary at low water.', exif: 'Canon R5 · 24mm · f/11 · 1/250' },
        { ar: '4 / 5', cap: 'Gulls working the mudflats.', exif: 'Canon R5 · 400mm · f/5.6 · 1/2000' },
        { ar: '3 / 2', cap: 'The light lasted about twenty minutes.', exif: 'Canon R5 · 70mm · f/8 · 1/500' },
      ],
    };
  }
}
</script>
</body>
</html>
