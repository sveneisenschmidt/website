# Adressen, die einmal gültig waren.
#
# Eine URL ist ein Versprechen. Was hier steht, ist eingelöst worden und wird nie
# wieder entfernt — eine Zeile zu löschen heisst, jemandem einen Link zu brechen,
# den er vor Jahren gesetzt hat.
#
# Diese Datei hat drei Verbraucher:
#
#   layouts/home.htaccess       erzeugt die 301 für den Server
#   layouts/_partials/pop.html  hält die Zählung an der alten Adresse fest
#   scripts/check-urls.sh       findet Adressen, die weder erzeugt noch gemappt sind
#
# Felder
#
#   from   die alte Adresse, mit führendem und abschliessendem Schrägstrich
#   to     wohin sie zeigt, ebenso
#   rss    "keep" — der Feed meldet weiter die alte Adresse als guid. Nur setzen,
#          wenn der Beitrag unter der alten Adresse tatsächlich im Feed stand. Sonst
#          bekommt er eine guid, die nie jemand gesehen hat, und erscheint als neu.
#   pop    "keep" — die Zielseite meldet weiter die alte Adresse als pageId, damit
#          Reaktionen und Besuchszähler am Beitrag bleiben.
#
#          Nur setzen, wenn die NEUE Adresse noch bei null steht. Pop kann zwei
#          Zählungen nicht zusammenführen, und wo beide Seiten Zahlen tragen, tauscht
#          ein Remap nur den Verlust aus und schreibt künftige Aufrufe unter die alte
#          Adresse. Bei den fünf Einträgen unten ist das der Fall, gemessen am
#          11. September 2026, deshalb steht dort keins.
#
#          Höchstens ein Eintrag je Ziel darf es tragen. Zwei wären eine stille
#          Entscheidung darüber, welche Zählung gewinnt.
#   note   warum

- from: /cv/
  to: /about/
  note: Lebenslauf gelöscht am 10. September 2026, sechs menschliche Aufrufe in acht Monaten

