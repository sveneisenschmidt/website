; PHP settings for every script in this folder: the site, the Panel and its
; API all run through index.php. The host runs PHP through FastCGI, which
; reads this file and ignores php_flag in .htaccess. PHP reads the file again
; after user_ini.cache_ttl, 300 seconds on the host.

; With upload progress on, PHP stores the progress of a file upload in the
; session that the cookie PHPSESSID names, also when no script starts a
; session. Reports on php2shell (CVE-2026-109618 and CVE-2026-109619,
; October 2026) suspect this as the path to the bug. Nothing here needs it:
; Kirby keeps its own sessions and never calls session_start(), and the Panel
; measures the progress of an upload in the browser.
session.upload_progress.enabled = Off
