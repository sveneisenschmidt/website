title: Über mich
icon: user
options:
  changeSlug: false
  changeStatus: false
  delete: false
columns:
  main:
    width: 2/3
    fields:
      text:
        label: Text
        type: markdown
        size: huge
        uploads: image
  sidebar:
    width: 1/3
    sections:
      meta:
        type: fields
        fields:
          label:
            label: Bezeichnung
            type: text
          lastmod:
            label: Zuletzt geprüft
            type: date
          author:
            label: Name
            type: text
            help: Autor in den Meta-Tags und in den Angaben für Suchmaschinen.
          email:
            label: E-Mail
            type: email
            help: Ziel des Links „Leave me a message“ unter About und jedem Beitrag. Leer fehlt der Link.
          profiles:
            label: Profile
            type: structure
            help: Links zu deinen Profilen auf anderen Seiten. Sie stehen nur in den Angaben für Suchmaschinen.
            fields:
              url:
                label: Adresse
                type: url
          jobtitle:
            label: Jobtitel
            type: text
            help: Steht nicht auf der Seite, nur in den Angaben für Suchmaschinen auf der Startseite. Das gilt auch für den Arbeitgeber.
          employer:
            label: Arbeitgeber
            type: text
          employerurl:
            label: Website des Arbeitgebers
            type: url
      images:
        extends: sections/post-images
