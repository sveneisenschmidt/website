# The site view "Website" of the Panel: the posts (tab "Beiträge"), the
# texts about the site for the page header, meta tags and feed (tab
# "Angaben"), the own IP addresses that the visitor statistics leave out
# (tab "Besucher", read by Website\Analytics\Fingerprint) and the settings
# of the assistant (tab "Assistent").
title: Website
tabs:
  beitraege: tabs/posts
  angaben:
    label: Angaben
    icon: info
    fields:
      heading:
        label: Überschrift
        type: text
        help: Steht oben auf jeder Seite. Leer steht dort der Titel der Website.
      description:
        label: Beschreibung
        type: textarea
        buttons: false
        help: Für Suchmaschinen und den Feed, wenn eine Seite keine eigene Zusammenfassung hat.
      keywords:
        label: Schlüsselwörter
        type: text
        help: Für Suchmaschinen, durch Kommas getrennt.
  besucher:
    label: Besucher
    icon: chart
    fields:
      ownIps:
        label: Eigene IP-Adressen
        type: textarea
        buttons: false
        help: "Abrufe von diesen Adressen zählen nicht als Besuch, auch rückwirkend. Eine Adresse pro Zeile, oder ein Netz mit /24 bei IPv4 und /64 bei IPv6. Deine Adresse gerade: {{ kirby.visitor.ip }}"
  assistent: tabs/assistant
