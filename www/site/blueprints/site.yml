# The site view "Website" of the Panel: the posts (tab "Beiträge") and the
# texts about the site for the page header, meta tags and feed (tab
# "Angaben"). The settings of a module are on a page of its own menu item,
# such as Besucher › Einstellungen (Website\Blog\Settings).
title: Website
tabs:
  beitraege: tabs/posts
  angaben:
    label: Angaben
    icon: info
    fields:
      heading:
        label: Überschrift
        type: text
        help: Steht oben auf jeder Seite. Leer steht dort der Titel der Website.
      description:
        label: Beschreibung
        type: textarea
        buttons: false
        help: Für Suchmaschinen und den Feed, wenn eine Seite keine eigene Zusammenfassung hat.
      keywords:
        label: Schlüsselwörter
        type: text
        help: Für Suchmaschinen, durch Kommas getrennt.
