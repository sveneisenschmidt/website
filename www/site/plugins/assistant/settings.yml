# The page Assistent › Einstellungen (index.php). The values are fields of
# the site in content/site.txt. The prompt is stored only in its field, so
# content/site.txt has it and the repository never does. The field has no
# default value and the repository has no prompt template, so no copy of
# the prompt reaches this public repository.
assistantPrompt:
  label: Prompt
  type: textarea
  buttons: false
  size: huge
# index.js fills the options of the model from the Models API
# (Claude::models()) and shows the effort levels the chosen model supports.
# Without a saved value, the page shows the defaults of Claude::model() and
# Claude::effort().
assistantModel:
  label: Modell
  type: select
  required: true
  help: Abgerechnet über den Schlüssel in env.php.
assistantEffort:
  label: Aufwand
  type: select
  required: true
  default: medium
  options:
    low: Niedrig
    medium: Mittel
    high: Hoch
    xhigh: Sehr hoch
    max: Maximal
  help: Mehr Aufwand heißt mehr Nachdenken und mehr Tokens. Modell und Aufwand gelten ab dem nächsten neuen Chat.
