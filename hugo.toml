baseURL = "https://sven.eisenschmidt.website/"

locale = "en-us"
title = "Sven Eisenschmidt - Personal Blog"
timeZone = "Europe/Berlin"


[pagination]
pagerSize = 10

[params]
description = "Personal website of Sven Eisenschmidt, based in Leipzig, Germany."
siteHeading = "Sven Eisenschmidt"
author = "Sven Eisenschmidt"
keywords = "Sven Eisenschmidt, Leipzig, Germany, video games, music, cycling, travel, software development, photography"
jobTitle = "Chief Technology & Product Officer"
employer = "roadsurfer"
employerUrl = "https://roadsurfer.com"
githubUrl = "https://github.com/sveneisenschmidt"
linkedinUrl = "https://linkedin.com/in/sveneisenschmidt"
stravaUrl = "https://strava.com/athletes/sveneisenschmidt"
email = "sven.eisenschmidt@gmail.com"

# .htaccess wird erzeugt statt kopiert, damit die Weiterleitungen aus
# data/redirects.yaml darin landen. Der Medientyp trägt keine Endung, sonst hiesse
# die Datei ".htaccess.txt".
[mediaTypes."text/htaccess"]
delimiter = ""

[outputFormats.htaccess]
mediaType = "text/htaccess"
baseName = ".htaccess"
isPlainText = true
notAlternative = true

# Keine Taxonomien. Ohne diese leere Tabelle baut Hugo seine Voreinstellung — und
# aus dem tags-Feld würden 7 Übersichtsseiten, die niemand verlinkt. Tags beschreiben,
# sie führen nirgendwohin.
[taxonomies]

# Die Dateien liegen nach Typ, die Adressen bleiben, wo sie immer waren. Ein Umzug
# der 272 Permalinks wäre 272 Weiterleitungen und in jedem Feedreader ein Schwall
# alter Beiträge — für eine Ordnung, die nur im Repository sichtbar ist.
[permalinks.page]
photos = "/posts/:contentbasename/"
trips = "/posts/:contentbasename/"
notes = "/posts/:contentbasename/"
essays = "/posts/:contentbasename/"

[outputs]
home = ["HTML", "RSS", "htaccess"]
section = ["HTML", "RSS"]
taxonomy = ["HTML"]
term = ["HTML"]

[markup.goldmark.renderer]
unsafe = true

[markup.goldmark.parser]
wrapStandAloneImageWithinParagraph = false

[markup.highlight]
codeFences = true
noClasses = false
lineNos = false

[markup.goldmark.parser.attribute]
block = true
title = true

[caches.getresource]
maxAge = 0

# Was die Filterzeile auf der Startseite schon anbietet, steht hier nicht noch
# einmal: Photos, All, Trip, Note und Essay sind dort und nirgends sonst.
[[menus.main]]
name = "Archive"
url = "/archive"
weight = 10

[[menus.main]]
name = "About"
url = "/about"
weight = 20

[[menus.main]]
name = "RSS"
url = "/index.xml"
weight = 30
