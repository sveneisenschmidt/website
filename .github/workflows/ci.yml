name: CI

# Every pull request and every push to main: lint, format, static analysis
# and tests. A push to main then deploys, but only when they pass. Both
# jobs run on the self-hosted runner. A pull request runs only from a
# branch of this repository (Sven's, Dependabot's): the repository is
# public, and the code of a fork must not run on that runner.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Composer downloads from GitHub with the token of this run. The runner keeps
# the global Composer config of earlier runs, and the token setup-php wrote
# there ran out with its run.
env:
  COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # The runner keeps PHP between jobs. setup-php takes about a minute, so
      # it runs only when the PHP of .php-version, an extension or Composer
      # is missing. The job deploy uses the same PHP.
      - name: PHP check
        id: php
        run: |
          if command -v php > /dev/null && command -v composer > /dev/null \
            && [ "$(php -r 'echo PHP_MAJOR_VERSION, ".", PHP_MINOR_VERSION;')" = "$(cat .php-version)" ] \
            && php -r 'foreach (["curl", "gd", "exif", "intl", "mbstring"] as $e) { if (!extension_loaded($e)) { exit(1); } }'; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        if: steps.php.outputs.ready != 'true'
        with:
          php-version-file: .php-version
          extensions: curl, gd, exif, intl, mbstring
          tools: composer
        env:
          runner: self-hosted

      - name: Install
        run: composer install --no-interaction --no-progress

      - name: Lint
        run: find www/site www/index.php bin tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Format
        run: vendor/bin/php-cs-fixer check --show-progress=none

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress

      - name: Tests
        run: vendor/bin/phpunit

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: self-hosted
    timeout-minutes: 20
    # One deploy at a time; a second push waits for the first. On this job
    # only, so a waiting deploy never cancels the tests of a pull request.
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # The runner keeps its files between jobs: key and known_hosts go to
      # $RUNNER_TEMP, which the runner empties after each job. The host key
      # comes from a secret, so a changed host key stops the deploy.
      - name: SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          [ -n "$DEPLOY_KNOWN_HOSTS" ] || { echo "Secret DEPLOY_KNOWN_HOSTS is missing: the output of ssh-keyscan for the deploy host"; exit 1; }
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/deploy_key"
          chmod 600 "$RUNNER_TEMP/deploy_key"
          ssh-keygen -y -f "$RUNNER_TEMP/deploy_key" > /dev/null || { echo "DEPLOY_SSH_KEY is not a valid private key"; exit 1; }
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > "$RUNNER_TEMP/known_hosts"

      # Host, user and folder come from secrets, as they name the hosting
      # account. bin/set-env.php writes the assistant's key into env.php on
      # the server.
      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SITE_URL: https://sven.eisenschmidt.website
        run: |
          export DEPLOY_SSH_KEY_FILE="$RUNNER_TEMP/deploy_key"
          export DEPLOY_KNOWN_HOSTS_FILE="$RUNNER_TEMP/known_hosts"
          bin/deploy.sh
