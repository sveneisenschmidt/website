name: Deploy

# Every push to main deploys the site: lint and tests first, then make deploy.
# The repository is public and the runner is self-hosted, so no pull
# request starts this workflow (the workflow Test checks pull requests).
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a second push waits for the first.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.actor == 'sveneisenschmidt'
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # The runner keeps PHP between jobs. setup-php takes about a minute, so
      # it runs only when the PHP of .php-version, an extension or Composer
      # is missing.
      - name: PHP check
        id: php
        run: |
          if command -v php > /dev/null && command -v composer > /dev/null \
            && [ "$(php -r 'echo PHP_MAJOR_VERSION, ".", PHP_MINOR_VERSION;')" = "$(cat .php-version)" ] \
            && php -r 'foreach (["gd", "exif", "intl", "mbstring"] as $e) { if (!extension_loaded($e)) { exit(1); } }'; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        if: steps.php.outputs.ready != 'true'
        with:
          php-version-file: .php-version
          extensions: gd, exif, intl, mbstring
          tools: composer
        env:
          runner: self-hosted

      - name: Install
        run: composer install --no-interaction --no-progress

      # make deploy runs neither: a failure here stops the run before the deploy.
      - name: Lint and tests
        run: make lint test

      # The runner keeps its files between jobs: key and known_hosts go to
      # $RUNNER_TEMP, which the runner empties after each job. The host key
      # comes from a secret, so a changed host key stops the deploy.
      - name: SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          [ -n "$DEPLOY_KNOWN_HOSTS" ] || { echo "Secret DEPLOY_KNOWN_HOSTS is missing: the output of ssh-keyscan for the deploy host"; exit 1; }
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/deploy_key"
          chmod 600 "$RUNNER_TEMP/deploy_key"
          ssh-keygen -y -f "$RUNNER_TEMP/deploy_key" > /dev/null || { echo "DEPLOY_SSH_KEY is not a valid private key"; exit 1; }
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > "$RUNNER_TEMP/known_hosts"

      # Host, user and folder come from secrets, as they name the hosting
      # account. Without an API key the deploy keeps the assistant's key.
      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          export DEPLOY_SSH_KEY_FILE="$RUNNER_TEMP/deploy_key"
          export DEPLOY_KNOWN_HOSTS_FILE="$RUNNER_TEMP/known_hosts"
          make deploy LIVE_HOST="$DEPLOY_USER@$DEPLOY_HOST" LIVE_PATH="${DEPLOY_PATH%/}"
