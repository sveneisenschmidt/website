name: Deploy

on:
  push:
    branches:
      - main
  schedule:
    # Every 2 hours
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      force_notify:
        description: "Nachricht auch ohne neuen Beitrag schicken"
        type: boolean
        default: false
      allow_shrink:
        description: "Weniger Seiten als live zulassen (nach dem Löschen von Beiträgen)"
        type: boolean
        default: false

jobs:
  deploy:
    if: github.actor == 'sveneisenschmidt'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Show build time and scheduled posts
        run: |
          echo "Current time (Hugo's perspective): $(date -u '+%Y-%m-%dT%H:%M:%S+00:00')"
          echo ""
          echo "Scheduled posts (future):"
          hugo list future || echo "No future posts"
          echo ""

      - name: Build
        env:
          TZ: Europe/Berlin
        run: hugo --minify

      - name: Build search index
        run: npx -y pagefind@1.5.2 --site public

      # Die Sitemap der laufenden Seite ist der Stand von vorher. Was in der
      # frisch gebauten steht und dort nicht, ist neu. Der Vergleich muss vor
      # dem Hochladen laufen, danach wäre beides gleich.
      - name: Find new pages
        id: new_pages
        run: |
          curl -sf https://sven.eisenschmidt.website/sitemap.xml \
            | grep -oE '<loc>[^<]+' | sed 's|<loc>||' | sort > /tmp/live.txt || : > /tmp/live.txt
          grep -oE '<loc>[^<]+' public/sitemap.xml | sed 's|<loc>||' | sort > /tmp/built.txt
          comm -13 /tmp/live.txt /tmp/built.txt > /tmp/new.txt
          COUNT=$(wc -l < /tmp/new.txt | tr -d ' ')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "first=$(head -1 /tmp/new.txt)" >> "$GITHUB_OUTPUT"
          echo "Neu: $COUNT"
          cat /tmp/new.txt

      # rsync läuft mit --delete, ein halber Build würde den Server also leerräumen.
      # Die laufende Seite ist der Maßstab: deutlich weniger Seiten als dort sind
      # ein Fehler, kein Stand zum Ausrollen.
      - name: Check the build
        env:
          ALLOW_SHRINK: ${{ inputs.allow_shrink }}
        run: |
          test -s public/index.html || { echo "public/index.html fehlt oder ist leer."; exit 1; }
          test -s public/.htaccess || { echo "public/.htaccess fehlt."; exit 1; }
          LIVE=$(wc -l < /tmp/live.txt | tr -d ' ')
          BUILT=$(wc -l < /tmp/built.txt | tr -d ' ')
          echo "Seiten live: $LIVE, gebaut: $BUILT"
          if [ "$LIVE" -gt 0 ] && [ "$BUILT" -lt $(( LIVE * 9 / 10 )) ]; then
            if [ "$ALLOW_SHRINK" = "true" ]; then
              echo "Weniger Seiten als live, per Schalter erlaubt."
            else
              echo "Abbruch: gebaut $BUILT, live $LIVE. Mit dem Schalter allow_shrink von Hand starten, wenn das so gewollt ist."
              exit 1
            fi
          fi

      - name: Deploy via SSH
        timeout-minutes: 10
        uses: easingthemes/ssh-deploy@v6
        with:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.DEPLOY_HOST }}
          REMOTE_USER: ${{ secrets.DEPLOY_USER }}
          TARGET: ${{ secrets.DEPLOY_PATH }}
          SOURCE: public/
          # Ohne --delete bleiben alte Dateien für immer liegen: Bildvarianten
          # aus früheren Zuschnitten, Verzeichnisse umbenannter Beiträge. Der
          # Stand auf dem Server ist damit genau der gebaute Stand.
          ARGS: -rltgoDzvO --delete --exclude=.ftp-deploy-sync-state.json
          SSH_CMD_ARGS: -o StrictHostKeyChecking=no -o ConnectTimeout=30

      # Nur wenn wirklich ein Beitrag dazugekommen ist, nicht bei jeder Änderung
      # an Vorlagen oder Stilen.
      - name: Notify
        if: steps.new_pages.outputs.count != '0' || inputs.force_notify
        # Geht an den eigenen ntfy-Server auf dem Homelab-Pi (Repo sveneisenschmidt/homelab).
        # Der Token gehört dem ntfy-Benutzer "website", der nur auf sein Topic schreiben darf.
        env:
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          FIRST: ${{ steps.new_pages.outputs.first }}
          COUNT: ${{ steps.new_pages.outputs.count }}
        run: |
          if [ -z "$NTFY_SERVER" ] || [ -z "$NTFY_TOPIC" ] || [ -z "$NTFY_TOKEN" ]; then
            echo "NTFY_SERVER, NTFY_TOPIC oder NTFY_TOKEN ist nicht gesetzt, keine Nachricht."
            exit 0
          fi
          # Beim Handstart ohne neuen Beitrag ist nichts neu, dann sagt die
          # Nachricht genau das und zeigt auf die Startseite.
          if [ -z "$FIRST" ]; then
            SUBJECT="Probelauf"
            BODY="Keine neuen Beiträge"
            FIRST="https://sven.eisenschmidt.website/"
            MARK="white_check_mark"
          else
            SUBJECT="Neu auf der Website"
            MARK="camera_flash"
            TITLE=$(basename "$FIRST" | sed 's/^[0-9][0-9-]*//; s/-/ /g')
            if [ "${COUNT:-0}" -gt 1 ]; then
              BODY="$TITLE und $((COUNT - 1)) weitere"
            else
              BODY="$TITLE"
            fi
          fi
          curl -sf \
            -H "Authorization: Bearer $NTFY_TOKEN" \
            -H "Title: $SUBJECT" \
            -H "Click: $FIRST" \
            -H "Tags: $MARK" \
            -d "$BODY" \
            "$NTFY_SERVER/$NTFY_TOPIC"

      - name: Submit to IndexNow
        run: |
          INDEXNOW_KEY=$(basename static/*-*-*-*-*.txt .txt)
          URLS=$(curl -s https://sven.eisenschmidt.website/sitemap.xml | grep -oE 'https://sven\.eisenschmidt\.website[^<]+')
          URL_LIST=$(echo "$URLS" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "Submitting $(echo "$URLS" | wc -l | tr -d ' ') URLs to IndexNow..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json" \
            -d "{\"host\":\"sven.eisenschmidt.website\",\"key\":\"$INDEXNOW_KEY\",\"urlList\":$URL_LIST}")
          echo "IndexNow response: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 400 ]; then exit 1; fi
