name: IndexNow

# Once a day, sends the pages that changed in the last 50 hours to IndexNow
# (bin/indexnow.php). Posts change in the Panel without a deploy, so this
# runs on a schedule. It is a workflow of its own, so an IndexNow error never
# stops a deploy.
on:
  schedule:
    # Every day at 6:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/actions
            bin
            www
          persist-credentials: false

      - uses: ./.github/actions/php

      - name: Submit to IndexNow
        run: php bin/indexnow.php "${{ vars.SITE_URL }}"
