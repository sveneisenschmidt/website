name: IndexNow

# Once a day, sends the pages that changed in the last 50 hours to IndexNow
# (bin/indexnow.php). Posts change in the Panel without a deploy, so this
# runs on a schedule. It is a workflow of its own, so an IndexNow error never
# stops a deploy.
on:
  schedule:
    # Every day at 6:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            bin
            www
          persist-credentials: false

      # No setup-php: the job uses the PHP that the workflow CI installed on
      # the self-hosted runner.
      - name: Submit to IndexNow
        run: php bin/indexnow.php "${{ vars.SITE_URL }}"

      # A scheduled run has no person who watches it.
      - name: Push message
        if: failure()
        env:
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -fsS -H "Authorization: Bearer $NTFY_TOKEN" -H "Title: Website: IndexNow failed" -H "Tags: warning" \
            -d "Run: $RUN" "$NTFY_SERVER/$NTFY_TOPIC" > /dev/null
