# Dependabot opens one pull request a week for each ecosystem: the Composer
# packages and the GitHub Actions. The workflow CI tests the pull request,
# merges it when the tests pass, and deploys it. For an action, Dependabot
# updates the pinned commit and its version comment together. For Composer,
# it changes only composer.lock, inside the version ranges of composer.json.
# A new major version of Kirby needs a change of composer.json by hand.
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    versioning-strategy: lockfile-only
    schedule:
      interval: weekly
    groups:
      composer:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
