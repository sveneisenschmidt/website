{{ if hugo.IsProduction }}
<script src="{{ site.Params.popScript | default "https://pop.eisenschmidt.website/pop.min.js" }}" defer></script>
<script defer>
    document.addEventListener("DOMContentLoaded", function () {
        if (window.location.hostname !== {{ (urls.Parse site.BaseURL).Hostname }}) return;
        Pop.init({
            endpoint: {{ site.Params.popEndpoint | default "https://pop.eisenschmidt.website/api" }},
            pageId: {{ partial "page-id.html" $ }},
            trackVisits: true
        });
    });
</script>
{{ end }}
